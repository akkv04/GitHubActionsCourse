name: 17 - 3 - Custom Actions - Docker

on:
    workflow_dispatch:
        inputs:
            url:
                type: string
                description: URL to ping
                default: 'https://www.google.com'

jobs:
    ping-url:
        name: ping-url
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: PING URL
              uses: ./.github/actions/docker-ping-url
              with:
                url: ${{ inputs.url }}