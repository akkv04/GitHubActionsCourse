name: 17 - 3 - Custom Actions - Docker

on:
    workflow_dispatch:
        inputs:
            url:
                type: choice
                description: URL to ping
                default: 'https://www.google.com'
                options:
                    - 'https://www.google.com'
                    - 'https:123.com'
            max_trial:
                description: Maximum trials until action fails,
                default: 10
                required: false
            delay:
                description: Delay in seconds between trials
                default: 5
                required: false

jobs:
    ping-url:
        name: ping-url
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: check the path and list directories
              run: |
                pwd
                ls -lrt
            - name: PING URL
              uses: ./.github/actions/docker-ping-url
              with:
                url: ${{ inputs.url }}
                max_trials: ${{ inputs.max_trial }}
                delay: ${{ inputs.delay }}