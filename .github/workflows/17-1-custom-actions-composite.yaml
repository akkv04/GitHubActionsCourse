name: 17 - 1 - Custom Actions - Composite


on:
    workflow_dispatch:
        inputs:
            target-env:
                type: choice
                options:
                    - prod
                    - dev

run-name: 17 - 1 - Custom Actions - Composite | env - ${{ inputs.target-env }}

env:
    working-directory: 17-custom-actions/react-app


jobs:
    build:
        name: build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: "${{ env.working-directory }}"
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: list contents
              run: |
                pwd
                ls -lrt

            - name: Setup Node and NPM Dependencies
              uses: ./.github/actions/composite-cache-deps@main
              with:
                node-version: 20.x
                working-dir: ${{ inputs.target-env }}

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build

